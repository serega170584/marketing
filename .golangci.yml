run:
  timeout: 5m

linters:
  enable:
    - errcheck      # Проверяет необработанные ошибки
    - govet         # Находит подозрительные конструкции, включая проблемы с циклами (loopclosure)
    - ineffassign   # Ищет бесполезные присваивания в переменные
    - staticcheck   # Мощный анализатор логических багов (находит бесконечные циклы)
    - unused        # Ищет неиспользуемые переменные, функции и структуры
    - bodyclose     # Проверяет, что res.Body.Close() вызван (критично для HTTP-клиентов)
    - errorlint     # Проверяет правильность оборачивания и сравнения ошибок (через %w, errors.Is)
    - gocritic      # Находит микро-баги, проблемы производительности и стилистические недочеты
    - gosec         # Сканирует код на уязвимости и проблемы безопасности (Hardcoded пароли и т.д.)
    - nakedret      # Запрещает «голые» возвраты (naked returns) в длинных функциях
    - noctx         # Проверяет, что HTTP-запросы создаются с контекстом (http.NewRequestWithContext)
    - prealloc      # Находит слайсы, для которых можно заранее выделить память через make([]T, 0, len)
    - wsl_v5
    - gocyclo
    - gocognit
    - lll
    - nestif
    - prealloc
    - asciicheck
    - contextcheck
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - exhaustive
    - exhaustruct_v5
    - forcetypeassert
    - gochecknoglobals
    - paralleltest
  settings:
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
version: 2
