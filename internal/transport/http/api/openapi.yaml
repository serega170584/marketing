openapi: 3.0.0

info:
  title: Marketing User, Order & Promotion API
  description: API for managing users, orders, promotions and promo codes.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

paths:

  /users:
    post:
      summary: Create a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: Get user list
      operationId: getUsers
      responses:
        '200':
          description: Successfully fetched user list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}:
    get:
      summary: Get user by ID
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the user
          schema:
            type: integer
            format: uint64
      responses:
        '200':
          description: Successfully fetched user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Update an existing user by ID
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders:
    post:
      summary: Create a new order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: Get order list
      operationId: getOrders
      responses:
        '200':
          description: Successfully fetched order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{id}:
    put:
      summary: Update an existing order by ID
      operationId: updateOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: uint64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderRequest'
      responses:
        '200':
          description: Order successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /promotions:
    post:
      summary: Create a new promotion
      operationId: createPromotion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePromotionRequest'
      responses:
        '201':
          description: Promotion successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      summary: Get promotions list
      operationId: getPromotions
      responses:
        '200':
          description: Successfully fetched promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PromotionResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /promotions/{id}:
    get:
      summary: Get promotion by ID
      operationId: getPromotionById
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Promotion details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: Update promotion
      operationId: updatePromotion
      parameters:
        - $ref: '#/components/parameters/UuidId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePromotionRequest'
      responses:
        '200':
          description: Promotion successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # PROMO CODES ENDPOINTS
  # ==========================================

  /promo-codes:
    post:
      summary: Create a new promo code
      operationId: createPromoCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePromoCodeRequest'
      responses:
        '201':
          description: Promo code successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      summary: Get promo codes list
      operationId: getPromoCodes
      parameters:
        - name: promotion_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully fetched promo codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PromoCodeResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /promo-codes/{id}:
    get:
      summary: Get promo code by ID
      operationId: getPromoCodeById
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Promo code details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ==========================================
  # PROMO REDEMPTIONS ENDPOINTS
  # ==========================================

  /promo-redemptions:
    get:
      summary: Get promo redemptions list
      operationId: getPromoRedemptions
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
            format: uint64
        - name: promotion_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: order_id
          in: query
          required: false
          schema:
            type: integer
            format: uint64
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PromoRedemptionStatus'
      responses:
        '200':
          description: Successfully fetched promo redemptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PromoRedemptionResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /promo-redemptions/reserve:
    post:
      summary: Reserve a promo code for an order
      operationId: reservePromoCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservePromoRequest'
      responses:
        '201':
          description: Promo code successfully reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoRedemptionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /promo-redemptions/{id}/redeem:
    post:
      summary: Confirm promo code redemption
      operationId: redeemPromoCode
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Promo code successfully redeemed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoRedemptionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /promo-redemptions/{id}/release:
    post:
      summary: Release reserved promo code
      operationId: releasePromoCode
      parameters:
        - $ref: '#/components/parameters/UuidId'
      responses:
        '200':
          description: Promo reservation successfully released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoRedemptionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'


components:

  parameters:
    UuidId:
      name: id
      in: path
      required: true
      description: UUID identifier
      schema:
        type: string
        format: uuid

  responses:
    BadRequestError:
      description: Invalid request body or payload validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error occurred while executing operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    CreateUserRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john.doe@example.com

    CreateUserResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: User created

    UpdateUserRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          example: John Smith
        email:
          type: string
          format: email
          example: john.smith@example.com

    UserResponse:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          format: uint64
          example: 1
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john.doe@example.com

    CreateOrderRequest:
      type: object
      required:
        - user_id
        - total_amount
      properties:
        user_id:
          type: integer
          format: uint64
          example: 1
        total_amount:
          type: number
          format: float
          example: 99.99

    CreateOrderResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Order created

    UpdateOrderRequest:
      type: object
      required:
        - status
        - total_amount
      properties:
        status:
          type: string
          example: processing
        total_amount:
          type: number
          format: float
          example: 120.50

    OrderResponse:
      type: object
      required:
        - id
        - user_id
        - status
        - total_amount
      properties:
        id:
          type: integer
          format: uint64
          example: 42
        user_id:
          type: integer
          format: uint64
          example: 1
        status:
          type: string
          example: pending
        total_amount:
          type: number
          format: float
          example: 99.99

    PromotionDiscountType:
      type: string
      enum:
        - PERCENTAGE
        - FIXED

    PromotionStatus:
      type: string
      enum:
        - ACTIVE
        - DISABLED

    PromoRedemptionStatus:
      type: string
      enum:
        - RESERVED
        - REDEEMED
        - RELEASED

    CreatePromotionRequest:
      type: object
      required:
        - name
        - discount_type
        - discount_value
        - max_discount
        - max_uses
        - starts_at
        - expires_at
        - status
      properties:
        name:
          type: string
          example: Summer Sale
        discount_type:
          $ref: '#/components/schemas/PromotionDiscountType'
        discount_value:
          type: integer
          example: 20
        max_discount:
          type: integer
          example: 100
        max_uses:
          type: integer
          format: int64
          example: 1000
        starts_at:
          type: string
          format: date-time
          example: '2026-06-01T00:00:00Z'
        expires_at:
          type: string
          format: date-time
          example: '2026-06-30T23:59:59Z'
        status:
          $ref: '#/components/schemas/PromotionStatus'

    UpdatePromotionRequest:
      type: object
      required:
        - name
        - discount_type
        - discount_value
        - max_discount
        - max_uses
        - starts_at
        - expires_at
        - status
      properties:
        name:
          type: string
        discount_type:
          $ref: '#/components/schemas/PromotionDiscountType'
        discount_value:
          type: integer
        max_discount:
          type: integer
        max_uses:
          type: integer
          format: int64
        starts_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/PromotionStatus'

    PromotionResponse:
      type: object
      required:
        - id
        - name
        - discount_type
        - discount_value
        - max_discount
        - max_uses
        - used_count
        - starts_at
        - expires_at
        - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        discount_type:
          $ref: '#/components/schemas/PromotionDiscountType'
        discount_value:
          type: integer
        max_discount:
          type: integer
        max_uses:
          type: integer
          format: int64
        used_count:
          type: integer
          format: int64
        starts_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/PromotionStatus'

    CreatePromoCodeRequest:
      type: object
      required:
        - code
        - promotion_id
        - max_uses_per_user
      properties:
        code:
          type: string
          example: SUMMER2026
        promotion_id:
          type: string
          format: uuid
        max_uses_per_user:
          type: integer
          format: int64
          example: 1

    PromoCodeResponse:
      type: object
      required:
        - id
        - code
        - promotion_id
        - max_uses_per_user
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: SUMMER2026
        promotion_id:
          type: string
          format: uuid
        max_uses_per_user:
          type: integer
          format: int64

    ReservePromoRequest:
      type: object
      required:
        - code
        - user_id
        - order_id
      properties:
        code:
          type: string
          example: SUMMER2026
        user_id:
          type: integer
          format: uint64
          example: 1
        order_id:
          type: integer
          format: uint64
          example: 42

    PromoRedemptionResponse:
      type: object
      required:
        - id
        - promotion_id
        - user_id
        - order_id
        - discount_amount
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        promotion_id:
          type: string
          format: uuid
        user_id:
          type: integer
          format: uint64
        order_id:
          type: integer
          format: uint64
        discount_amount:
          type: integer
          format: int64
          example: 2000
        status:
          $ref: '#/components/schemas/PromoRedemptionStatus'
        created_at:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Something went wrong on our end
