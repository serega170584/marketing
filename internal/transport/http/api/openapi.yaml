
openapi: 3.0.0

info:
  title: Marketing Promo API
  description: API for managing promotions, promo codes and promo redemptions.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

tags:
  - name: Promotions
    description: Promotion management
  - name: Promo Codes
    description: Promo code management
  - name: Promo Redemptions
    description: Promo code reservation and redemption management

paths:

  # =========================
  # PROMOTIONS
  # =========================

  /promotions:
    post:
      tags:
        - Promotions
      summary: Create a new promotion
      operationId: createPromotion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePromotionRequest'
      responses:
        '201':
          description: Promotion successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Promotions
      summary: Get promotions list
      operationId: getPromotions
      responses:
        '200':
          description: Successfully fetched promotions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PromotionResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /promotions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Promotion UUID
        schema:
          type: string
          format: uuid

    get:
      tags:
        - Promotions
      summary: Get promotion by ID
      operationId: getPromotionById
      responses:
        '200':
          description: Successfully fetched promotion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Promotions
      summary: Update promotion
      operationId: updatePromotion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePromotionRequest'
      responses:
        '200':
          description: Promotion successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =========================
  # PROMO CODES
  # =========================

  /promo-codes:
    post:
      tags:
        - Promo Codes
      summary: Create a new promo code
      operationId: createPromoCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePromoCodeRequest'
      responses:
        '201':
          description: Promo code successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Promo code already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Promo Codes
      summary: Get promo codes list
      operationId: getPromoCodes
      parameters:
        - name: promotion_id
          in: query
          required: false
          description: Filter promo codes by promotion UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully fetched promo codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PromoCodeResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /promo-codes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Promo code UUID
        schema:
          type: string
          format: uuid

    get:
      tags:
        - Promo Codes
      summary: Get promo code by ID
      operationId: getPromoCodeById
      responses:
        '200':
          description: Successfully fetched promo code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =========================
  # PROMO REDEMPTIONS
  # =========================

  /promo-redemptions:
    get:
      tags:
        - Promo Redemptions
      summary: Get promo redemptions list
      operationId: getPromoRedemptions
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: promotion_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: order_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PromoRedemptionStatus'
      responses:
        '200':
          description: Successfully fetched promo redemptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PromoRedemptionResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /promo-redemptions/reserve:
    post:
      tags:
        - Promo Redemptions
      summary: Reserve promo code
      description: Creates a promo redemption with RESERVED status.
      operationId: reservePromoCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservePromoRequest'
      responses:
        '201':
          description: Promo code successfully reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoRedemptionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Promo code cannot be reserved because a usage limit has been reached or it is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /promo-redemptions/{id}/redeem:
    parameters:
      - name: id
        in: path
        required: true
        description: Promo redemption UUID
        schema:
          type: string
          format: uuid

    post:
      tags:
        - Promo Redemptions
      summary: Redeem reserved promo code
      description: Changes redemption status from RESERVED to REDEEMED.
      operationId: redeemPromoCode
      responses:
        '200':
          description: Promo code successfully redeemed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoRedemptionResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Redemption is not in RESERVED status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /promo-redemptions/{id}/release:
    parameters:
      - name: id
        in: path
        required: true
        description: Promo redemption UUID
        schema:
          type: string
          format: uuid

    post:
      tags:
        - Promo Redemptions
      summary: Release reserved promo code
      description: Changes redemption status from RESERVED to RELEASED.
      operationId: releasePromoCode
      responses:
        '200':
          description: Promo reservation successfully released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoRedemptionResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Redemption is not in RESERVED status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:

  # =========================
  # RESPONSES
  # =========================

  responses:
    BadRequestError:
      description: Invalid request body or validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # =========================
  # SCHEMAS
  # =========================

  schemas:

    # PROMOTION ENUMS

    PromotionDiscountType:
      type: string
      enum:
        - PERCENTAGE
        - FIXED

    PromotionStatus:
      type: string
      enum:
        - ACTIVE
        - DISABLED

    PromoRedemptionStatus:
      type: string
      enum:
        - RESERVED
        - REDEEMED
        - RELEASED

    # PROMOTIONS

    CreatePromotionRequest:
      type: object
      required:
        - name
        - discount_type
        - discount_value
        - max_discount
        - max_uses
        - starts_at
        - expires_at
        - status
      properties:
        name:
          type: string
          example: Summer Sale
        discount_type:
          $ref: '#/components/schemas/PromotionDiscountType'
        discount_value:
          type: integer
          example: 20
          description: Percentage or fixed discount value
        max_discount:
          type: integer
          format: int32
          example: 100
        max_uses:
          type: integer
          format: int64
          example: 1000
        starts_at:
          type: string
          format: date-time
          example: "2026-06-01T00:00:00Z"
        expires_at:
          type: string
          format: date-time
          example: "2026-12-31T23:59:59Z"
        status:
          $ref: '#/components/schemas/PromotionStatus'

    UpdatePromotionRequest:
      allOf:
        - $ref: '#/components/schemas/CreatePromotionRequest'

    PromotionResponse:
      type: object
      required:
        - id
        - name
        - discount_type
        - discount_value
        - max_discount
        - max_uses
        - used_count
        - starts_at
        - expires_at
        - status
      properties:
        id:
          type: string
          format: uuid
          example: "11111111-1111-1111-1111-111111111111"
        name:
          type: string
          example: Summer Sale
        discount_type:
          $ref: '#/components/schemas/PromotionDiscountType'
        discount_value:
          type: integer
          example: 20
        max_discount:
          type: integer
          format: int32
          example: 100
        max_uses:
          type: integer
          format: int64
          example: 1000
        used_count:
          type: integer
          format: int64
          example: 150
        starts_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/PromotionStatus'

    # PROMO CODES

    CreatePromoCodeRequest:
      type: object
      required:
        - code
        - promotion_id
        - max_uses_per_user
      properties:
        code:
          type: string
          example: SUMMER2026
        promotion_id:
          type: string
          format: uuid
          example: "11111111-1111-1111-1111-111111111111"
        max_uses_per_user:
          type: integer
          format: int64
          example: 1

    PromoCodeResponse:
      type: object
      required:
        - id
        - code
        - promotion_id
        - max_uses_per_user
      properties:
        id:
          type: string
          format: uuid
          example: "22222222-2222-2222-2222-222222222222"
        code:
          type: string
          example: SUMMER2026
        promotion_id:
          type: string
          format: uuid
        max_uses_per_user:
          type: integer
          format: int64
          example: 1

    # PROMO REDEMPTIONS

    ReservePromoRequest:
      type: object
      required:
        - code
        - user_id
        - order_id
      properties:
        code:
          type: string
          example: SUMMER2026
        user_id:
          type: string
          format: uuid
          example: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
        order_id:
          type: string
          format: uuid
          example: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"

    PromoRedemptionResponse:
      type: object
      required:
        - id
        - promotion_id
        - user_id
        - order_id
        - discount_amount
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
          example: "33333333-3333-3333-3333-333333333333"
        promotion_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        discount_amount:
          type: integer
          format: int64
          example: 2000
        status:
          $ref: '#/components/schemas/PromoRedemptionStatus'
        created_at:
          type: string
          format: date-time

    # SYSTEM

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Something went wrong on our end
